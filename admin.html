<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f4efe8">
<title>MIKAERAS · Διαχείριση</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:'NSD';font-weight:300;font-display:swap;src:url(fonts/noto-serif-display-latin-300-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:'NSD';font-weight:300;font-display:swap;src:url(fonts/noto-serif-display-greek-300-normal.woff2) format('woff2');unicode-range:U+0370-03FF,U+1F00-1FFF}
@font-face{font-family:'MR';font-weight:400;font-display:swap;src:url(fonts/manrope-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:'MR';font-weight:400;font-display:swap;src:url(fonts/manrope-greek-400-normal.woff2) format('woff2');unicode-range:U+0370-03FF}
@font-face{font-family:'MR';font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:'MR';font-weight:600;font-display:swap;src:url(fonts/manrope-greek-600-normal.woff2) format('woff2');unicode-range:U+0370-03FF}
:root{--cream:#f4efe8;--paper:#fffdfa;--sand:#e8dfd3;--taupe:#a28f7a;--mocha:#6f5f50;--cocoa:#3a3029;--ink:#161311;--ok:#3f7a55;--warn:#b0603f;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'MR',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:110px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.serif{font-family:'NSD',Georgia,serif;font-weight:300}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:rgba(244,239,232,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(58,48,41,.08)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{font-family:'NSD',serif;letter-spacing:.22em;font-size:19px}
.brand small{font-family:'MR';font-size:10px;letter-spacing:.14em;color:var(--mocha);margin-left:8px;text-transform:uppercase}
.pill{height:38px;padding:0 16px;border-radius:999px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.pill.light{background:#fff;border:1px solid rgba(58,48,41,.14)}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
h1{font-family:'NSD',serif;font-weight:300;font-size:34px;line-height:1.1;margin:26px 0 6px}
.lead{color:var(--mocha);font-size:14px;line-height:1.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{background:var(--paper);border-radius:18px;padding:16px;box-shadow:0 1px 0 rgba(58,48,41,.06)}
.stat b{display:block;font-size:24px;font-family:'NSD',serif;font-weight:300}
.stat span{font-size:11.5px;color:var(--mocha)}
.bar{display:flex;gap:8px;align-items:center;margin:8px 0 14px}
.search{flex:1;height:46px;border-radius:14px;border:1px solid rgba(58,48,41,.14);background:#fff;padding:0 14px;font-size:15px}
.add{height:46px;padding:0 18px;border-radius:14px;background:var(--ink);color:var(--cream);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.add svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.hint{font-size:12px;color:var(--mocha);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:30px 64px 1fr auto;gap:12px;align-items:center;background:var(--paper);border-radius:18px;padding:10px 12px 10px 6px;box-shadow:0 1px 0 rgba(58,48,41,.06),0 8px 22px -18px rgba(58,48,41,.4);transition:transform .25s var(--ease),box-shadow .25s,opacity .25s;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.item.drag{box-shadow:0 24px 50px -16px rgba(58,48,41,.5);transform:scale(1.02);z-index:5;position:relative;opacity:.96}
.item.ghost{opacity:.35}
.handle{width:30px;height:48px;display:grid;place-items:center;cursor:grab;touch-action:none;color:var(--taupe)}
.handle svg{width:18px;height:18px;fill:currentColor}
.item img{width:64px;height:80px;border-radius:10px;object-fit:cover;object-position:50% 25%;background:var(--sand)}
.item .t{font-weight:600;font-size:14px;line-height:1.3}
.item .s{font-size:12.5px;color:var(--mocha);margin-top:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--sand);color:var(--cocoa)}
.tag.new{background:var(--ink);color:var(--cream)}
.tag.out{background:#f3dfd6;color:var(--warn)}
.tag.hid{background:#e7e4e0;color:#7a746e}
.edit-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--cream)}
.edit-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6}

/* publish bar */
.pub{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:756px;margin:0 auto;background:var(--ink);color:var(--cream);border-radius:22px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 24px 50px -18px rgba(22,19,17,.6);transform:translateY(150%);transition:transform .5s var(--ease)}
.pub.on{transform:none}
.pub .txt{flex:1;font-size:13px;line-height:1.35}
.pub .txt b{display:block;font-size:14px}
.pub .go{height:46px;padding:0 18px;border-radius:14px;background:var(--cream);color:var(--ink);font-weight:600;font-size:13.5px}
.pub .pv{height:46px;padding:0 12px;border-radius:14px;color:var(--cream);font-size:12.5px;text-decoration:underline}

/* editor sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(22,19,17,.4);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:94svh;background:var(--cream);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .55s var(--ease);display:flex;flex-direction:column;max-width:780px;margin:0 auto}
.sheet.on{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(58,48,41,.08)}
.sh-h h2{font-family:'NSD',serif;font-weight:300;font-size:24px}
.sh-b{overflow-y:auto;padding:16px 18px 30px;-webkit-overflow-scrolling:touch}
.sh-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid rgba(58,48,41,.08);background:var(--cream)}
.sh-f .save{flex:1;height:52px;border-radius:16px;background:var(--ink);color:var(--cream);font-weight:600}
.sh-f .del{height:52px;padding:0 16px;border-radius:16px;color:var(--warn);font-weight:600;font-size:13px}
.box{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:12px}
.box h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mocha);margin-bottom:12px;font-weight:600}
.f{margin-bottom:12px}.f:last-child{margin-bottom:0}
.f label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;border:1px solid rgba(58,48,41,.16);border-radius:12px;padding:12px 13px;background:#fff;font-size:16px}
.f textarea{min-height:96px;resize:vertical;line-height:1.5}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--cocoa);box-shadow:0 0 0 4px rgba(111,95,80,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:11.5px;color:var(--mocha);margin-top:5px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--sand);touch-action:none}
.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;pointer-events:none}
.ph .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(255,253,250,.94);display:grid;place-items:center}
.ph .x svg{width:12px;height:12px;stroke:var(--ink);stroke-width:2}
.ph .first{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:600;background:var(--ink);color:var(--cream);padding:3px 7px;border-radius:999px}
.ph.drag{outline:2px solid var(--ink);opacity:.8}
.upl{aspect-ratio:3/4;border-radius:12px;border:1.5px dashed rgba(58,48,41,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--mocha);text-align:center;padding:6px;cursor:pointer}
.upl svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.4}
.upl input{display:none}
.sz{display:grid;grid-template-columns:1fr auto 30px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(58,48,41,.08)}
.sz:last-of-type{border-bottom:0}
.sz input.nm{border:1px solid rgba(58,48,41,.16);border-radius:10px;padding:9px 11px;font-weight:600;width:100%;font-size:16px;background:#fff}
.step{display:flex;align-items:center;background:var(--cream);border-radius:12px}
.step button{width:42px;height:42px;font-size:20px}
.step span{min-width:30px;text-align:center;font-weight:600}
.rmz{color:var(--taupe);font-size:20px}
.addsz{margin-top:10px;font-size:13px;font-weight:600;color:var(--cocoa)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.tg+.tg{border-top:1px solid rgba(58,48,41,.08)}
.tg b{font-size:14px;display:block}.tg span{font-size:12px;color:var(--mocha)}
.sw{position:relative;width:52px;height:32px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:#d8cfc4;transition:.3s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.3s var(--ease)}
.sw input:checked+i{background:var(--ink)}
.sw input:checked+i::after{transform:translateX(20px)}

/* login + modal */
.gate{min-height:100svh;display:grid;place-items:center;padding:24px}
.gate .card{width:100%;max-width:380px;text-align:center}
.gate .brand{font-size:30px;display:block;margin-bottom:6px}
.gate input{width:100%;height:54px;border-radius:16px;border:1px solid rgba(58,48,41,.16);padding:0 16px;font-size:17px;text-align:center;margin:24px 0 10px;background:#fff;letter-spacing:.1em}
.gate button{width:100%;height:54px;border-radius:16px;background:var(--ink);color:var(--cream);font-weight:600}
.gate .err{color:var(--warn);font-size:13px;min-height:20px;margin-top:10px}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(22,19,17,.45);opacity:0;pointer-events:none;transition:.3s}
.modal.on{opacity:1;pointer-events:auto}
.modal .in{background:var(--cream);border-radius:22px;padding:22px;max-width:420px;width:100%;transform:scale(.96);transition:.35s var(--ease)}
.modal.on .in{transform:none}
.modal h3{font-family:'NSD',serif;font-weight:300;font-size:24px;margin-bottom:8px}
.modal p{font-size:14px;color:var(--mocha);line-height:1.55}
.modal .acts{display:flex;gap:10px;margin-top:18px}
.modal .acts button{flex:1;height:48px;border-radius:14px;font-weight:600}
.modal .acts .yes{background:var(--ink);color:var(--cream)}
.modal .acts .no{background:#fff}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-150%);z-index:70;background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:transform .5s var(--ease);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.spin{width:18px;height:18px;border:2px solid rgba(22,19,17,.2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;background:var(--sand);padding:4px;border-radius:14px;margin:18px 0 14px}
.tabs button{flex:1;height:40px;border-radius:11px;font-size:13px;font-weight:600;color:var(--mocha)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.2)}
@media (min-width:700px){.sheet{bottom:auto;top:50%;border-radius:24px;transform:translateY(-45%) scale(.98);opacity:0;pointer-events:none;transition:transform .5s var(--ease),opacity .35s}.sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto}.photos{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sh-h"><h2 id="shTitle">Προϊόν</h2><button class="pill light" id="shClose">Κλείσιμο</button></div><div class="sh-b" id="shBody"></div><div class="sh-f" id="shFoot"></div></div>
<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>
<div class="toast" id="toast"></div>
<div class="pub" id="pub"><div class="txt" id="pubTxt"></div><a class="pv" href="index.html?preview=1" target="_blank">Δείτε</a><button class="go" id="pubGo">Δημοσίευση</button></div>

<script>
(function(){
/* ---------- settings ----------
   PASS: the shop owner's code for this panel (change before delivery).
   REPO: GitHub repo the shop is published from. Publishing commits products.json + photos there,
   which is free (no hosting credits) and goes live in about a minute. */
const PASS='mikaeras2026';
const REPO={owner:'agelmet',repo:'MIKAERAS',branch:'main'};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Ο χώρος της συσκευής γέμισε — δημοσιεύστε τις αλλαγές')}}};
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[α-ω]/g,c=>({α:'a',β:'v',γ:'g',δ:'d',ε:'e',ζ:'z',η:'i',θ:'th',ι:'i',κ:'k',λ:'l',μ:'m',ν:'n',ξ:'x',ο:'o',π:'p',ρ:'r',σ:'s',ς:'s',τ:'t',υ:'y',φ:'f',χ:'ch',ψ:'ps',ω:'o'}[c]||'')).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('item-'+Date.now());
let D=null, base=null, editing=null, tab='products';
let pending=st.get('mk_admin_imgs',{}); // path -> dataURL of new photos not yet published

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function modal(title,text,yes,no,onYes){$('#modalIn').innerHTML=`<h3>${title}</h3><p>${text}</p><div class="acts">${no?`<button class="no" id="mNo">${no}</button>`:''}<button class="yes" id="mYes">${yes}</button></div>`;$('#modal').classList.add('on');$('#mYes').onclick=()=>{$('#modal').classList.remove('on');onYes&&onYes()};if(no)$('#mNo').onclick=()=>$('#modal').classList.remove('on')}

/* ---------- login ---------- */
function gate(){
  if(st.get('mk_admin_ok',false))return start();
  $('#app').innerHTML=`<div class="gate"><div class="card"><span class="brand">MIKAERAS</span><div class="lead">Ο πίνακας του καταστήματός σας</div><input type="password" id="pw" placeholder="Κωδικός" autocomplete="current-password"><button id="in">Είσοδος</button><div class="err" id="err"></div></div></div>`;
  const go=()=>{if($('#pw').value.trim()===PASS){st.set('mk_admin_ok',true);start()}else{$('#err').textContent='Λάθος κωδικός. Δοκιμάστε ξανά.';$('#pw').value=''}};
  $('#in').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};
}

/* ---------- data ---------- */
async function start(){
  $('#app').innerHTML='<div class="gate"><span class="spin"></span></div>';
  try{const r=await fetch('products.json?v='+Date.now(),{cache:'no-store'});base=await r.json()}catch(e){base={settings:{},products:[]}}
  const draft=st.get('mk_preview',null);
  D=draft?draft:JSON.parse(JSON.stringify(base));
  render();
}
const dirty=()=>JSON.stringify(D)!==JSON.stringify(base);
function save(){st.set('mk_preview',D);updPub()}
function updPub(){
  const on=dirty(); $('#pub').classList.toggle('on',on);
  $('#pubTxt').innerHTML='<b>Έχετε αλλαγές</b>Πατήστε Δημοσίευση';
}
const stock=p=>(p.sizes||[]).reduce((a,s)=>a+(+s.q||0),0);
const imgSrc=src=>pending[src]||src;

/* ---------- home ---------- */
function render(){
  const P=D.products, live=P.filter(p=>p.active!==false), out=live.filter(p=>stock(p)<=0).length, pcs=live.reduce((a,p)=>a+stock(p),0);
  $('#app').innerHTML=`<header><div class="wrap"><div class="brand">MIKAERAS<small>Διαχείριση</small></div><a class="pill light" href="index.html${dirty()?'?preview=1':''}" target="_blank"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Το κατάστημα</a></div></header>
  <div class="wrap">
    <h1>Καλώς ήρθατε</h1><p class="lead">Εδώ αλλάζετε προϊόντα, φωτογραφίες, τιμές και τεμάχια. Όταν τελειώσετε, πατήστε «Δημοσίευση».</p>
    <div class="stats"><div class="stat"><b>${live.length}</b><span>προϊόντα online</span></div><div class="stat"><b>${pcs}</b><span>τεμάχια διαθέσιμα</span></div><div class="stat"><b>${out}</b><span>εξαντλημένα</span></div></div>
    <div class="tabs"><button data-tab="products" class="${tab==='products'?'on':''}">Προϊόντα</button><button data-tab="settings" class="${tab==='settings'?'on':''}">Ρυθμίσεις</button></div>
    <div id="pane"></div>
  </div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  tab==='products'?paneProducts():paneSettings();
  updPub();
}
function paneProducts(){
  $('#pane').innerHTML=`<div class="bar"><input class="search" id="q" placeholder="Αναζήτηση προϊόντος" type="search"><button class="add" id="addP"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Νέο</button></div>
   <div class="hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>Σύρετε από τις τελείες για να αλλάξετε τη σειρά στο κατάστημα</div>
   <div class="list" id="list"></div>`;
  drawList(); $('#q').oninput=drawList; $('#addP').onclick=()=>openEd(null);
}
function drawList(){
  const q=($('#q')?.value||'').toLowerCase();
  $('#list').innerHTML=D.products.map((p,i)=>{
    if(q&&!p.name.toLowerCase().includes(q))return '';
    const s=stock(p);
    return `<div class="item" data-i="${i}"><div class="handle" aria-label="Μετακίνηση"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></div>
      <img src="${esc(imgSrc(p.images[0]||''))}" alt="">
      <div data-open="${i}"><div class="t">${esc(p.name)}</div><div class="s">${p.sale?`<s>${p.price}€</s> ${p.sale}€`:p.price+'€'} · ${(p.sizes||[]).map(z=>z.s+' '+z.q).join(' · ')}</div>
      <div class="tags">${p.active===false?'<span class="tag hid">Κρυφό</span>':''}${p.isNew?'<span class="tag new">Νέο</span>':''}${s<=0?'<span class="tag out">Εξαντλήθηκε</span>':s<=2?'<span class="tag">Λίγα τεμάχια</span>':''}${p.sale?'<span class="tag">Προσφορά</span>':''}</div></div>
      <button class="edit-btn" data-open="${i}" aria-label="Επεξεργασία"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button></div>`}).join('');
  $('#list').querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openEd(+el.dataset.open));
  dragList();
}
/* drag to reorder (touch + mouse) */
function dragList(){
  const list=$('#list');
  list.querySelectorAll('.handle').forEach(h=>{
    h.onpointerdown=e=>{
      if(($('#q').value||'').trim()){toast('Καθαρίστε την αναζήτηση για να αλλάξετε σειρά');return}
      e.preventDefault(); const item=h.closest('.item'); const items=[...list.children]; const from=items.indexOf(item);
      const r=item.getBoundingClientRect(), y0=e.clientY, H=r.height+10; let to=from;
      item.classList.add('drag'); h.setPointerCapture(e.pointerId);
      h.onpointermove=ev=>{const dy=ev.clientY-y0; item.style.transform=`translateY(${dy}px) scale(1.02)`;
        to=Math.max(0,Math.min(items.length-1,from+Math.round(dy/H)));
        items.forEach((it,k)=>{if(it===item)return; let s=0; if(from<to&&k>from&&k<=to)s=-H; if(from>to&&k<from&&k>=to)s=H; it.style.transform=s?`translateY(${s}px)`:''})};
      h.onpointerup=h.onpointercancel=()=>{h.onpointermove=null;h.onpointerup=null;items.forEach(it=>{it.style.transform='';it.classList.remove('drag')});
        if(to!==from){const [m]=D.products.splice(from,1);D.products.splice(to,0,m);save();drawList();if(navigator.vibrate)navigator.vibrate(8)}};
    };
  });
}

/* ---------- settings ---------- */
function paneSettings(){

  $('#pane').innerHTML=`<div class="box"><h3>Αποστολή</h3><div class="two"><div class="f"><label>Δωρεάν αποστολή από (€)</label><input type="number" inputmode="decimal" id="s1" value="${s.freeShipping??69}"></div><div class="f"><label>Κόστος αποστολής (€)</label><input type="number" inputmode="decimal" id="s2" value="${s.shippingCost??4}"></div></div><div class="f"><label>Επιβάρυνση αντικαταβολής (€)</label><input type="number" inputmode="decimal" id="s3" value="${s.codFee??0}"></div></div>
   <div class="box"><h3>Μήνυμα στην κορυφή</h3><div class="f"><label>Κείμενο που κυλάει πάνω πάνω</label><input id="s4" value="${esc(s.announcement||'')}"></div></div>
   <div class="box"><h3>Επικοινωνία</h3><div class="f"><label>Email</label><input id="s5" type="email" value="${esc(s.email||'')}"></div></div>

  [['s1','freeShipping',1],['s2','shippingCost',1],['s3','codFee',1],['s4','announcement'],['s5','email']].forEach(([id,k,n])=>$('#'+id).oninput=e=>{D.settings[k]=n?(+e.target.value||0):e.target.value;save()});
  $('#reset').onclick=()=>modal('Ακύρωση αλλαγών;','Θα επιστρέψετε σε ό,τι φαίνεται τώρα στο κατάστημα.','Ναι, ακύρωση','Όχι',()=>{localStorage.removeItem('mk_preview');pending={};st.set('mk_admin_imgs',{});D=JSON.parse(JSON.stringify(base));render();toast('Οι αλλαγές ακυρώθηκαν')});
  $('#logout').onclick=()=>{localStorage.removeItem('mk_admin_ok');gate()};
}

/* ---------- editor ---------- */
const CATS=()=>[...new Set(['Φορέματα','Σετ','Ολόσωμες','Πανωφόρια','Μπλούζες','Παντελόνια','Φούστες','Αξεσουάρ',...D.products.map(p=>p.category).filter(Boolean)])];
function openEd(i){
  editing=i===null?{id:'',name:'',tagline:'',category:'Φορέματα',price:'',sale:null,isNew:true,active:true,desc:'',images:[],sizes:[{s:'S',q:1},{s:'M',q:1},{s:'L',q:1}],_new:true}:JSON.parse(JSON.stringify(D.products[i]));
  editing._i=i;
  $('#shTitle').textContent=i===null?'Νέο προϊόν':'Επεξεργασία';
  drawEd();
  $('#shFoot').innerHTML=`${i===null?'':'<button class="del" id="del">Διαγραφή</button>'}<button class="save" id="sv">${i===null?'Προσθήκη':'Αποθήκευση'}</button>`;
  $('#sv').onclick=saveEd; if($('#del'))$('#del').onclick=()=>modal('Διαγραφή προϊόντος;',`Το «${esc(editing.name)}» θα αφαιρεθεί από το κατάστημα μετά τη δημοσίευση. Αν θέλετε απλώς να το κρύψετε προσωρινά, κλείστε το «Εμφανίζεται στο κατάστημα».`,'Διαγραφή','Άκυρο',()=>{D.products.splice(editing._i,1);save();closeEd();render();toast('Διαγράφηκε')});
  $('#sheet').classList.add('on');$('#scrim').classList.add('on');document.body.style.overflow='hidden';$('#shBody').scrollTop=0;
}
function closeEd(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');document.body.style.overflow='';editing=null}
$('#shClose').onclick=closeEd;$('#scrim').onclick=closeEd;
function drawEd(){
  const e=editing;
  $('#shBody').innerHTML=`
  <div class="box"><h3>Φωτογραφίες</h3><div class="photos" id="photos">${e.images.map((src,k)=>`<div class="ph" data-k="${k}"><img src="${esc(imgSrc(src))}" alt="">${k===0?'<span class="first">Κύρια</span>':''}<button class="x" data-x="${k}" aria-label="Αφαίρεση"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></div>`).join('')}
   <label class="upl"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 9"/></svg>Προσθήκη<br>φωτογραφιών<input type="file" accept="image/*" multiple id="file"></label></div>
   <p class="small">Η πρώτη φωτογραφία είναι η κύρια. Σύρετε μια φωτογραφία για να αλλάξετε τη σειρά.</p></div>
  <div class="box"><h3>Στοιχεία</h3>
   <div class="f"><label>Όνομα προϊόντος</label><input id="e_name" value="${esc(e.name)}" placeholder="π.χ. Σατέν maxi φόρεμα"></div>
   <div class="f"><label>Μικρή φράση (προαιρετικό)</label><input id="e_tag" value="${esc(e.tagline||'')}" placeholder="π.χ. A maxi dress, a whole mood."></div>
   <div class="two"><div class="f"><label>Τιμή (€)</label><input id="e_price" type="number" inputmode="decimal" value="${e.price??''}"></div><div class="f"><label>Τιμή προσφοράς (€)</label><input id="e_sale" type="number" inputmode="decimal" value="${e.sale??''}" placeholder="Κενό = χωρίς"></div></div>
   <div class="f"><label>Κατηγορία</label><select id="e_cat">${CATS().map(c=>`<option ${c===e.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
   <div class="f"><label>Περιγραφή</label><textarea id="e_desc" placeholder="Ύφασμα, εφαρμογή, πώς φοριέται…">${esc(e.desc||'')}</textarea></div></div>
  <div class="box"><h3>Μεγέθη & τεμάχια</h3><div id="szs">${e.sizes.map((z,k)=>`<div class="sz"><input class="nm" data-zn="${k}" value="${esc(z.s)}" aria-label="Μέγεθος"><div class="step"><button data-zm="${k}" aria-label="Λιγότερα">−</button><span>${z.q}</span><button data-zp="${k}" aria-label="Περισσότερα">+</button></div><button class="rmz" data-zr="${k}" aria-label="Αφαίρεση μεγέθους">×</button></div>`).join('')}</div>
   <button class="addsz" id="addsz">+ Προσθήκη μεγέθους</button><p class="small">Όταν ένα μέγεθος φτάσει στο 0, εμφανίζεται ως εξαντλημένο.</p></div>
  <div class="box"><h3>Εμφάνιση</h3>
   <div class="tg"><div><b>Εμφανίζεται στο κατάστημα</b><span>Κλείστε το για να το κρύψετε χωρίς να το σβήσετε</span></div><label class="sw"><input type="checkbox" id="e_act" ${e.active!==false?'checked':''}><i></i></label></div>
   <div class="tg"><div><b>Στις «Νέες αφίξεις»</b><span>Φαίνεται πρώτο, στην κορυφή</span></div><label class="sw"><input type="checkbox" id="e_new" ${e.isNew?'checked':''}><i></i></label></div></div>`;
  const b=$('#shBody');
  const bind=(id,k,num)=>{$('#'+id).oninput=ev=>{const v=ev.target.value;e[k]=num?(v===''?null:+v):v}};
  bind('e_name','name');bind('e_tag','tagline');bind('e_price','price',1);bind('e_sale','sale',1);bind('e_desc','desc');
  $('#e_cat').onchange=ev=>e.category=ev.target.value; $('#e_act').onchange=ev=>e.active=ev.target.checked; $('#e_new').onchange=ev=>e.isNew=ev.target.checked;
  b.querySelectorAll('[data-zn]').forEach(x=>x.oninput=ev=>e.sizes[+x.dataset.zn].s=ev.target.value.trim());
  b.querySelectorAll('[data-zm]').forEach(x=>x.onclick=()=>{const z=e.sizes[+x.dataset.zm];z.q=Math.max(0,z.q-1);x.nextElementSibling.textContent=z.q});
  b.querySelectorAll('[data-zp]').forEach(x=>x.onclick=()=>{const z=e.sizes[+x.dataset.zp];z.q++;x.previousElementSibling.textContent=z.q});
  b.querySelectorAll('[data-zr]').forEach(x=>x.onclick=()=>{e.sizes.splice(+x.dataset.zr,1);drawEd()});
  $('#addsz').onclick=()=>{const next=['XS','S','M','L','XL','One size'].find(s=>!e.sizes.some(z=>z.s===s))||'';e.sizes.push({s:next,q:1});drawEd()};
  b.querySelectorAll('[data-x]').forEach(x=>x.onclick=ev=>{ev.stopPropagation();e.images.splice(+x.dataset.x,1);drawEd()});
  $('#file').onchange=async ev=>{const files=[...ev.target.files];if(!files.length)return;toast('Ετοιμάζονται οι φωτογραφίες…');
    for(const f of files){try{const url=await shrink(f);const path=`img/u-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}.webp`;pending[path]=url;e.images.push(path)}catch(err){toast('Μια φωτογραφία δεν διαβάστηκε')}}
    st.set('mk_admin_imgs',pending);drawEd();toast('Οι φωτογραφίες προστέθηκαν')};
  dragPhotos();
}
/* photo reorder by dragging */
function dragPhotos(){
  const grid=$('#photos');
  grid.querySelectorAll('.ph').forEach(ph=>{
    ph.onpointerdown=e=>{if(e.target.closest('.x'))return;const from=+ph.dataset.k;ph.setPointerCapture(e.pointerId);let moved=false;const x0=e.clientX,y0=e.clientY;
      ph.onpointermove=ev=>{if(Math.hypot(ev.clientX-x0,ev.clientY-y0)>6){moved=true;ph.classList.add('drag');ph.style.transform=`translate(${ev.clientX-x0}px,${ev.clientY-y0}px)`}};
      ph.onpointerup=ev=>{ph.onpointermove=null;ph.style.transform='';ph.classList.remove('drag');if(!moved)return;
        ph.style.visibility='hidden';const el=document.elementFromPoint(ev.clientX,ev.clientY);ph.style.visibility='';const t=el&&el.closest('.ph');
        if(t&&t!==ph){const to=+t.dataset.k;const [m]=editing.images.splice(from,1);editing.images.splice(to,0,m);drawEd()}};
    };
  });
}
/* resize on the phone before upload: max 1400px, webp */
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const M=1400;let w=img.naturalWidth,h=img.naturalHeight;if(Math.max(w,h)>M){const r=M/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);let d=c.toDataURL('image/webp',.84);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',.86);res(d)};img.onerror=rej;img.src=u})}
function saveEd(){
  const e=editing;
  if(!e.name.trim())return toast('Γράψτε όνομα προϊόντος');
  if(!(e.price>0))return toast('Βάλτε τιμή');
  if(!e.images.length)return toast('Προσθέστε τουλάχιστον μία φωτογραφία');
  if(e.sale&&e.sale>=e.price)return toast('Η τιμή προσφοράς πρέπει να είναι μικρότερη');
  e.sizes=e.sizes.filter(z=>z.s);
  const i=e._i, isNew=e._new; delete e._i; delete e._new;
  if(isNew){let id=slug(e.name),n=2;while(D.products.some(p=>p.id===id))id=slug(e.name)+'-'+(n++);e.id=id;D.products.unshift(e)}else D.products[i]=e;
  save();closeEd();render();toast(isNew?'Το προϊόν προστέθηκε':'Αποθηκεύτηκε');
}

/* ---------- publish ----------
   Uses a GitHub key that Advon sets once on her phone (kept only on that device). */
function b64(str){return btoa(unescape(encodeURIComponent(str)))}
async function gh(path,method='GET',body){const tok=st.get('mk_gh','');const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${path}${method==='GET'?'?ref='+REPO.branch:''}`,{method,headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});if(r.status===404&&method==='GET')return null;if(!r.ok)throw new Error(r.status);return r.json()}
async function putFile(path,b64content,msg){const cur=await gh(path);await gh(path,'PUT',{message:msg,content:b64content,branch:REPO.branch,sha:cur?cur.sha:undefined})}
$('#pubGo').onclick=()=>{
  if(!st.get('mk_gh','')){
    $('#modalIn').innerHTML=`<h3>Σύνδεση δημοσίευσης</h3><p>Γίνεται μία φορά σε κάθε συσκευή. Θα σας δώσουμε το κλειδί σύνδεσης εμείς.</p><div class="f" style="margin-top:14px"><input id="tok" placeholder="Κλειδί σύνδεσης" autocomplete="off"></div><div class="acts"><button class="no" id="mNo">Άκυρο</button><button class="yes" id="mYes">Σύνδεση</button></div>`;
    $('#modal').classList.add('on');$('#mNo').onclick=()=>$('#modal').classList.remove('on');
    $('#mYes').onclick=()=>{const t=$('#tok').value.trim();if(!t)return;st.set('mk_gh',t);$('#modal').classList.remove('on');publish()};return}
  publish();
};
async function publish(){
  const btn=$('#pubGo'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  try{
    const used=new Set(D.products.flatMap(p=>p.images));
    for(const [path,data] of Object.entries(pending)){if(!used.has(path))continue;$('#pubTxt').innerHTML='<b>Ανεβαίνουν οι φωτογραφίες…</b>Μην κλείσετε τη σελίδα';await putFile(path,data.split(',')[1],'Νέα φωτογραφία προϊόντος')}
    $('#pubTxt').innerHTML='<b>Δημοσίευση…</b>Σχεδόν έτοιμο';
    await putFile('products.json',b64(JSON.stringify(D,null,2)),'Ενημέρωση προϊόντων από τον πίνακα');
    base=JSON.parse(JSON.stringify(D)); pending={}; st.set('mk_admin_imgs',{}); localStorage.removeItem('mk_preview');
    modal('Δημοσιεύτηκε!','Οι αλλαγές σας θα φαίνονται στο κατάστημα σε περίπου ένα λεπτό.','Τέλεια');render();
  }catch(err){
    if(String(err.message).match(/401|403/)){localStorage.removeItem('mk_gh');modal('Το κλειδί δεν δούλεψε','Ελέγξτε ότι το αντιγράψατε σωστά ή ζητήστε μας νέο.','Εντάξει')}
    else modal('Δεν ολοκληρώθηκε','Ελέγξτε τη σύνδεση στο ίντερνετ και πατήστε ξανά «Δημοσίευση». Οι αλλαγές σας δεν χάθηκαν.','Εντάξει');
    updPub();
  }finally{btn.disabled=false;btn.textContent='Δημοσίευση'}
}
gate();
})();
</script>
